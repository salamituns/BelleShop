apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
  namespace: dev
spec:
  metrics:
    - name: error-rate-check
      interval: 10s
      count: 3
      successCondition: result[0] <= 0.05
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus-stack-kube-prom-prometheus.monitoring.svc:9090
          query: |
            (
              sum(rate(http_requests_total{job="backend", status="5xx"}[1m])) or vector(0)
            )
            /
            (
              (sum(rate(http_requests_total{job="backend"}[1m])) > 0) or vector(1)
            )
