# SonarQube Scanner Configuration for BelleShop
sonar.projectKey=belleshop
sonar.projectName=BelleShop E-Commerce Microservices
sonar.projectVersion=1.0.0

# Source Directories
sonar.sources=backend,frontend
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/*.tar,**/*.sql,**/coverage/**,**/public/**

# Python & JS Analysis
sonar.python.version=3.12
sonar.javascript.node.maxspace=2048
